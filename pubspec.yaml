name: kidbook
description: A little library of stories, told in your voice.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.11.4
dependencies:
  flutter:
    sdk: flutter
  record: ^6.2.1
  just_audio: ^0.10.6
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
